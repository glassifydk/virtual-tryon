<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" fill="none">
  <!-- Left lens -->
  <rect x="50" y="35" width="125" height="70" rx="6" stroke="#333366" stroke-width="5" fill="rgba(51,51,102,0.1)"/>
  <!-- Right lens -->
  <rect x="225" y="35" width="125" height="70" rx="6" stroke="#333366" stroke-width="5" fill="rgba(51,51,102,0.1)"/>
  <!-- Bridge -->
  <line x1="175" y1="60" x2="225" y2="60" stroke="#333366" stroke-width="5"/>
  <!-- Left temple -->
  <line x1="50" y1="50" x2="5" y2="42" stroke="#333366" stroke-width="4" stroke-linecap="round"/>
  <!-- Right temple -->
  <line x1="350" y1="50" x2="395" y2="42" stroke="#333366" stroke-width="4" stroke-linecap="round"/>
</svg>
